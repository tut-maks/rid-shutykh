<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>КОЛІЯ — шини для агро і спецтехніки (демо)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#1f6b34}a:hover{color:#14361f}
*{box-sizing:border-box}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes roll{0%,100%{transform:translateX(0) rotate(0deg)}50%{transform:translateX(-24px) rotate(-40deg)}}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes kenburns{from{transform:scale(1.04)}to{transform:scale(1.14) translateY(-2%)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes soil{to{background-position:-800px 0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,158,68,.5)}50%{box-shadow:0 0 0 10px rgba(47,158,68,0)}}
.spin{animation:spin 40s linear infinite}
.kb{animation:kenburns 22s ease-in-out infinite alternate}
.in1{animation:rise .8s .05s both cubic-bezier(.2,.7,.2,1)}
.in2{animation:rise .8s .2s both cubic-bezier(.2,.7,.2,1)}
.in3{animation:rise .8s .35s both cubic-bezier(.2,.7,.2,1)}
.in4{animation:rise .8s .5s both cubic-bezier(.2,.7,.2,1)}
.track{display:flex;width:max-content;animation:marquee 40s linear infinite}
.soilband{height:72px;background-image:url(/koliya-p7x4/img/soil.svg);background-size:800px 72px;background-repeat:repeat-x;animation:soil 24s linear infinite}
.pulse{animation:pulse 2.4s infinite}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:14px;font:800 16px/1 Manrope,sans-serif;text-decoration:none;transition:transform .2s,background .2s,color .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn-yellow{background:#f2c230;color:#14361f;box-shadow:0 10px 24px -12px rgba(160,120,0,.8)}.btn-yellow:hover{background:#ffd34d;color:#14361f}
.btn-green{background:#1f6b34;color:#ffffff}.btn-green:hover{background:#14361f;color:#ffffff}
.btn-line{border:2px solid #1f6b34;color:#1f6b34;background:#ffffff}.btn-line:hover{background:#1f6b34;color:#ffffff}
.cat{transition:transform .3s,border-color .3s,box-shadow .3s}
.cat:hover{transform:translateY(-6px);border-color:#2f9e44;box-shadow:0 22px 40px -24px rgba(20,54,31,.45)}
.cat:hover .caticon{color:#2f9e44}
.catimg{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.cat:hover .catimg{transform:scale(1.08)}
@keyframes xfade{0%,40%{opacity:0;transform:scale(1.04)}50%,90%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.12)}}
.xfade{opacity:0;animation:xfade 18s ease-in-out infinite}
.seg{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.seg:hover{transform:translateY(-6px)}
.seg img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.seg:hover img{transform:scale(1.06)}
.photo-zoom{transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.photo-zoom:hover{transform:scale(1.04)}
.card{transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-8px);box-shadow:0 26px 50px -24px rgba(20,54,31,.45)}
.card img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:rotate(120deg)}
.tab{min-height:44px;padding:0 20px;border-radius:12px;border:1.5px solid #cfdccc;background:#ffffff;color:#172119;font:700 15px Manrope,sans-serif;cursor:pointer;transition:all .2s}
.tab:hover{border-color:#1f6b34}
.tab.on{background:#1f6b34;border-color:#1f6b34;color:#ffffff}
.pill{min-height:44px;min-width:60px;padding:0 14px;border-radius:12px;border:1.5px solid #cfdccc;background:#ffffff;color:#172119;font:700 15px Manrope,sans-serif;cursor:pointer;transition:all .2s}
.pill:hover{border-color:#1f6b34}
.pill.on{background:#f2c230;border-color:#f2c230;color:#14361f}
.field{width:100%;min-height:52px;padding:0 16px;border-radius:12px;border:1.5px solid #cfdccc;background:#ffffff;color:#172119;font:500 16px Manrope,sans-serif}
.field:focus{outline:2px solid #1d5fa8;outline-offset:1px}
.dfield{width:100%;min-height:52px;padding:0 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#ffffff;font:500 16px Manrope,sans-serif}
.dfield::placeholder{color:#b7cdb9}
.dfield option{color:#172119}
.navlink{color:#172119;text-decoration:none;font:700 15px Manrope,sans-serif}.navlink:hover{color:#2f9e44}
.flink{color:#cfe0d0;text-decoration:none}.flink:hover{color:#f2c230}
@supports (animation-timeline: view()){
.reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
}
@media (max-width:900px){
.wrap{padding:0 20px}
.nav{display:none !important}
.hero{grid-template-columns:1fr !important}
.herotire{display:none}
.two{grid-template-columns:1fr !important}
}
@media (prefers-reduced-motion:reduce){
.spin,.kb,.track,.soilband,.pulse,.in1,.in2,.in3,.in4,.reveal,.herotire img{animation:none !important}
}
</style>

Для тих, хто працює на землі

<div>
<div style="font: 700 12px Manrope, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #1d5fa8">Хіт сезону</div>

<div><div style="font: 800 17px Manrope, sans-serif">Гарантія виробника</div><div style="font-size: 14px; color: #d4e3f5; margin-top: 4px; line-height: 1.5">Офіційні документи на кожну партію</div></div>

<div><div style="font: 800 17px Manrope, sans-serif">Сертифікат EUR.1</div><div style="font-size: 14px; color: #d4e3f5; margin-top: 4px; line-height: 1.5">Підтверджене турецьке походження</div></div>

<div style="padding: 26px 28px; display: flex; gap: 14px; align-items: flex-start">

</span>

<section id="picker" style="padding: 56px 0 64px">
<div class="wrap">
<div class="reveal" style="border-radius: 28px; background: #f5f8f2; border: 1px solid #e3ebe1; padding: 40px; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">

<span style="display: block; height: 150px; overflow: hidden"><img src="{{t.photo}}" alt="{{t.label}}" class="catimg" style="width: 100%; height: 100%; object-fit: cover"></span>
